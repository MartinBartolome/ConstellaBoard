name: Deploy Supabase Edge Functions

on:
  push:
    # systembrett-v1: vorübergehend, um das Backend vor dem Merge zu testen
    branches: [main, systembrett-v1]
    paths: ['supabase/functions/**', '.github/workflows/deploy-supabase.yml']
  workflow_dispatch:

permissions:
  contents: read

env:
  SUPABASE_PROJECT_REF: jkoricufhaqemnqgpneo

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Zugangsdaten prüfen
        run: |
          if [ -z "${{ secrets.SUPABASE_ACCESS_TOKEN }}" ]; then
            echo "::error::Secret SUPABASE_ACCESS_TOKEN fehlt (siehe docs/INSTALLATION.md)"; exit 1
          fi
      - name: Erlaubte Herkunft für CORS setzen
        run: supabase secrets set --project-ref "$SUPABASE_PROJECT_REF" ALLOWED_ORIGINS="https://${{ github.repository_owner }}.github.io,http://localhost:4173,http://localhost:5173"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      - name: Edge Functions veröffentlichen
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF" --use-api
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
