name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typprüfung
        run: npm run typecheck
      - name: Unit-Tests
        run: npm test
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Edge Functions prüfen
        working-directory: supabase/functions
        run: deno check --config deno.json */index.ts
      - name: Playwright installieren
        run: npx playwright install --with-deps chromium
      - name: Browsertests (lokales Brett)
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results
          retention-days: 3
