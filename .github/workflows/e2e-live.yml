name: Live-Tests (echtes Backend)

# Mehrbenutzer-, Echtzeit-, Berechtigungs- und Sicherheitstests gegen das
# echte Supabase-Projekt. Erzeugt kurzlebige Testsitzungen und beendet sie.
on:
  workflow_dispatch:
  workflow_run:
    workflows: ['Deploy Supabase Edge Functions']
    types: [completed]

permissions:
  contents: read

jobs:
  live:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Live-Tests
        run: npx playwright test --config playwright.live.config.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: live-report
          path: test-results
          retention-days: 3
